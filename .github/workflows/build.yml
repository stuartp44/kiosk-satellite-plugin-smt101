name: Build plugin package

on:
  push:
    branches:
      - main
      - 'copilot/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          test -f "${ANDROID_HOME:-${ANDROID_SDK_ROOT}}/platforms/android-35/android.jar"
          test -x "${ANDROID_HOME:-${ANDROID_SDK_ROOT}}/build-tools/35.0.0/d8" || \
            test -x "${ANDROID_HOME:-${ANDROID_SDK_ROOT}}/build-tools/35.0.1/d8" || \
            test -x "${ANDROID_HOME:-${ANDROID_SDK_ROOT}}/build-tools/36.0.0/d8" || \
            test -x "${ANDROID_HOME:-${ANDROID_SDK_ROOT}}/build-tools/37.0.0/d8"

      - name: Test and build package
        shell: bash
        run: gradle --no-daemon clean build -PandroidPlatform=35

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smt101-plugin-dist
          retention-days: 30
          path: |
            dist/kiosk-satellite-plugin.json
            dist/*.zip
            dist/*.zip.sha256
