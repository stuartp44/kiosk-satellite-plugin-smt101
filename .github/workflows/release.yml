name: Publish plugin release

on:
  push:
    branches:
      - main
    paths:
      - kiosk-satellite-plugin.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plugin-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Read and validate manifest version
        id: version
        shell: bash
        run: |
          version="$(jq -er '.version' kiosk-satellite-plugin.json)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::Invalid plugin version: $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "zip=smt101-sensors-$version.zip" >> "$GITHUB_OUTPUT"

      - name: Require a new version
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG already exists. Bump the manifest version before publishing."
            exit 1
          fi

      - name: Verify Android SDK
        shell: bash
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_root"
          test -f "$sdk_root/platforms/android-35/android.jar"
          find "$sdk_root/build-tools" -type f -name d8 -perm -111 -print -quit | grep -q .

      - name: Test and build package
        shell: bash
        run: gradle --no-daemon clean build -PandroidPlatform=35

      - name: Verify package
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ZIP: ${{ steps.version.outputs.zip }}
        run: |
          test -f "dist/$ZIP"
          test -f "dist/$ZIP.sha256"
          (cd dist && sha256sum --check "$ZIP.sha256")
          packaged_version="$(unzip -p "dist/$ZIP" kiosk-satellite-plugin.json | jq -er '.version')"
          test "$packaged_version" = "$VERSION"

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          ZIP: ${{ steps.version.outputs.zip }}
        run: |
          gh release create "$TAG" \
            "dist/$ZIP" \
            "dist/$ZIP.sha256" \
            --target "$GITHUB_SHA" \
            --title "SMT101 Sensors v$VERSION" \
            --generate-notes

      - name: Remove superseded version releases and tags
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_TAG: ${{ steps.version.outputs.tag }}
        run: |
          while IFS= read -r old_tag; do
            if [[ -n "$old_tag" && "$old_tag" != "$CURRENT_TAG" ]]; then
              gh release delete "$old_tag" --cleanup-tag --yes
            fi
          done < <(gh release list --limit 100 --json tagName --jq '.[].tagName')

          git fetch --tags --force
          while IFS= read -r old_tag; do
            if [[ "$old_tag" =~ ^v[0-9] && "$old_tag" != "$CURRENT_TAG" ]]; then
              git push origin --delete "$old_tag"
            fi
          done < <(git tag --list)
