name: Prepare and publish plugin release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: plugin-release
  cancel-in-progress: false

jobs:
  release-pr:
    runs-on: ubuntu-24.04
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Prepare release PR or create merged release
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-pr
    if: needs.release-pr.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out released source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-pr.outputs.tag_name }}

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and verify released package
        env:
          RELEASE_VERSION: ${{ needs.release-pr.outputs.version }}
        run: bash scripts/prepare-release.sh "$RELEASE_VERSION"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-pr.outputs.tag_name }}
          RELEASE_VERSION: ${{ needs.release-pr.outputs.version }}
        run: |
          gh release upload "$RELEASE_TAG" \
            dist/kiosk-satellite-plugin.json \
            "dist/smt101-sensors-$RELEASE_VERSION.zip" \
            "dist/smt101-sensors-$RELEASE_VERSION.zip.sha256" \
            --clobber
