name: Publish plugin release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: plugin-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    # Skip the version-bump commit that semantic-release pushes back to main.
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    steps:
      - name: Check out source and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify Android SDK
        shell: bash
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_root"
          test -f "$sdk_root/platforms/android-35/android.jar"
          find "$sdk_root/build-tools" -type f -name d8 -perm -111 -print -quit | grep -q .

      - name: Install release tooling
        run: npm ci

      - name: Run semantic-release
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npx semantic-release

      - name: Remove superseded version releases and tags
        if: steps.release.outputs.version != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_TAG: v${{ steps.release.outputs.version }}
        run: |
          while IFS= read -r old_tag; do
            if [[ -n "$old_tag" && "$old_tag" != "$CURRENT_TAG" ]]; then
              gh release delete "$old_tag" --cleanup-tag --yes
            fi
          done < <(gh release list --limit 100 --json tagName --jq '.[].tagName')

          git fetch --tags --force
          while IFS= read -r old_tag; do
            if [[ "$old_tag" =~ ^v[0-9] && "$old_tag" != "$CURRENT_TAG" ]]; then
              git push origin --delete "$old_tag"
            fi
          done < <(git tag --list)
